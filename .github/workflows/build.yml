
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find project folder
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found. Files in repo:"
            find . -not -path './.git/*' -type f
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" RareUser.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: RareUser v${{ github.run_number }}
          files: RareUser.apk
